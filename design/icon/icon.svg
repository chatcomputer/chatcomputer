<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="0.55" stop-color="#3a3fd6"/>
      <stop offset="1" stop-color="#1d1f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6ff"/>
      <stop offset="1" stop-color="#c9cff0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fc8ff"/>
      <stop offset="0.6" stop-color="#2b7bff"/>
      <stop offset="1" stop-color="#5a3df0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0c3d" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="screenClip"><rect x="262" y="262" width="430" height="282" rx="18"/></clipPath>
  </defs>

  <!-- macOS icon body: 824×824 rounded square centred on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Monitor -->
  <g filter="url(#shadow)" transform="translate(-22 0)">
    <rect x="236" y="236" width="482" height="334" rx="40" fill="url(#bezel)"/>
    <rect x="262" y="262" width="430" height="282" rx="18" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)">
      <!-- guest menu bar and a window -->
      <rect x="262" y="262" width="430" height="26" fill="#ffffff" fill-opacity="0.32"/>
      <circle cx="282" cy="275" r="5.5" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="298" y="271" width="38" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
      <rect x="346" y="271" width="26" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
      <rect x="306" y="318" width="250" height="172" rx="14" fill="#ffffff" fill-opacity="0.92"/>
      <rect x="306" y="318" width="250" height="28" rx="14" fill="#e9ecff"/>
      <rect x="306" y="332" width="250" height="14" fill="#e9ecff"/>
      <circle cx="324" cy="332" r="5" fill="#ff5f57"/><circle cx="340" cy="332" r="5" fill="#febc2e"/><circle cx="356" cy="332" r="5" fill="#28c840"/>
      <rect x="326" y="364" width="150" height="10" rx="5" fill="#3a3fd6" fill-opacity="0.55"/>
      <rect x="326" y="386" width="200" height="10" rx="5" fill="#3a3fd6" fill-opacity="0.3"/>
      <rect x="326" y="408" width="120" height="10" rx="5" fill="#3a3fd6" fill-opacity="0.3"/>
      <!-- the agent's pointer -->
      <path d="M 498 410 L 498 468 L 512 455 L 523 478 L 534 473 L 523 450 L 541 449 Z" fill="#ffffff" stroke="#1d1f7a" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- stand -->
    <path d="M 432 570 L 522 570 L 534 640 L 420 640 Z" fill="#c9cff0"/>
    <rect x="370" y="632" width="214" height="22" rx="11" fill="url(#bezel)"/>
  </g>

  <!-- Chat bubble -->
  <g filter="url(#shadow)" transform="translate(-22 0)">
    <path d="M 560 560 h 214 a 58 58 0 0 1 58 58 v 70 a 58 58 0 0 1 -58 58 h -96 l -58 50 l 8 -50 h -68 a 58 58 0 0 1 -58 -58 v -70 a 58 58 0 0 1 58 -58 z" fill="url(#bubble)"/>
    <circle cx="600" cy="653" r="19" fill="#3a3fd6"/>
    <circle cx="667" cy="653" r="19" fill="#3a3fd6" fill-opacity="0.75"/>
    <circle cx="734" cy="653" r="19" fill="#3a3fd6" fill-opacity="0.5"/>
  </g>
</svg>
