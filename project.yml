# Generate ChatComputer.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen generate
name: ChatComputer
options:
  bundleIdPrefix: app.chatcomputer
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # App and guest agent share one version; bump both here for every release.
    MARKETING_VERSION: "0.9.8"
    CURRENT_PROJECT_VERSION: "40"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode. A stable Developer ID signature matters for the guest
    # agent: TCC grants in the guest are bound to it.
    DEVELOPMENT_TEAM: YPV49M8592
packages:
  ChatComputerKit:
    path: Packages/ChatComputerKit
  # The guest agent's modules, built for macOS 26 too.
  ChatComputerAgentKit:
    path: Packages/ChatComputerAgentKit
  # The chat transcript: Markdown rendering and a reusing list (both MIT).
  MarkdownView:
    url: https://github.com/Lakr233/MarkdownView
    from: 4.8.2
  ListViewKit:
    url: https://github.com/Lakr233/ListViewKit
    from: 4.6.0
targets:
  ChatComputer:
    type: application
    platform: macOS
    sources: [Apps/ChatComputer]
    dependencies:
      - package: ChatComputerKit
        products: [ChatCore, ModelProxy, Orchestrator, VMKit, GuestBridge, HostControl, ComputerControl]
      - package: ChatComputerAgentKit
        product: BridgeProtocol
      - package: MarkdownView
        product: MarkdownView
      - package: ListViewKit
        product: ListViewKit
      # The guest agent ships inside the host app and is copied into the VM during onboarding.
      - target: ChatComputerAgent
        embed: true
        copy:
          destination: resources
          subpath: GuestAgent
    info:
      path: Apps/ChatComputer/Info.plist
      properties:
        CFBundleDisplayName: Chat Computer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    entitlements:
      path: Apps/ChatComputer/ChatComputer.entitlements
      # XcodeGen rewrites the .entitlements file from these properties on every generate.
      properties:
        com.apple.security.virtualization: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chatcomputer.ChatComputer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ChatComputerAgent:
    type: application
    platform: macOS
    sources: [Apps/ChatComputerAgent]
    dependencies:
      - package: ChatComputerAgentKit
        products: [AgentCore, BridgeProtocol]
    info:
      path: Apps/ChatComputerAgent/Info.plist
      properties:
        CFBundleDisplayName: Chat Computer Agent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    entitlements:
      path: Apps/ChatComputerAgent/ChatComputerAgent.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chatcomputer.agent
        # The agent also runs in macOS 26 guests. Launch Services, and so Privacy settings, refuses an app built
        # for a newer macOS (-10825): the agent would never show in the Accessibility list there.
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ChatComputer:
    build:
      targets:
        ChatComputer: all
        ChatComputerAgent: all
    run:
      config: Debug
    test:
      config: Debug
